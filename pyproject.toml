[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huntzero"
version = "0.1.0"
description = "huntzero — LLM 主导的假设驱动漏洞挖掘引擎（私有化交付）"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "huntzero Team"}]
keywords = ["security", "vulnerability", "llm", "audit"]
dependencies = [
    "kimi-agent-sdk==0.0.5",
    "rich>=13.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-c",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.20",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
huntzero = "kimi:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "tools*"]
exclude = ["tests*", "docs*", "skills*"]

[tool.setuptools]
py-modules = ["kimi", "kimi_hive", "kimi_sdk_compat"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
